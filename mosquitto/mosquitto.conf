# Mosquitto 2 only listens on localhost unless a listener is declared.
listener 1883 0.0.0.0

# DEV ONLY: anonymous access. Before deploying to the Pi, set
# allow_anonymous false and add: password_file /mosquitto/config/passwd
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# QVGA JPEGs are ~5-20 KB; cap payloads to guard against garbage.
message_size_limit 262144
